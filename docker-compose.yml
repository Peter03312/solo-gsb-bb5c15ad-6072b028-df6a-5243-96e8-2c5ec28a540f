services:
  web:
    build: .
    image: bus-fare-checker:latest
    container_name: bus-fare-checker
    ports:
      - "8000:8000"
    volumes:
      - bus-data:/data
    environment:
      # SQLite 数据库文件位置（命名卷持久化）；留用默认即可，
      # 服务首次启动时会自动在此建库并写入默认规则参数。
      DB_PATH: /data/bus.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  bus-data:

